[project]
name = "ltx25-studio"
version = "0.1.0"
description = "A Gradio studio for LTX-2.5 — every mode, with user-uploadable LoRA at inference time."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mayank Gupta", email = "techfreakworm@gmail.com" }]

# Runtime dependencies are declared in requirements.txt — that is the file the
# Hugging Face Space build reads, and it is the single source of truth for pins.
# See docs/PLAN.md §5.1, including why `spaces` is deliberately NOT pinned there.

[project.optional-dependencies]
# Dev tooling lives here rather than in requirements.txt so the Space image stays
# lean. Install with: .venv/bin/python -m pip install -e ".[dev]"
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
    # Must match requirements.txt and the Space's sdk_version. Installed into the
    # shared .venv so test_app.py's headless-build acceptance test actually runs
    # — a skipped acceptance test proves nothing.
    "gradio==6.24.0",
]

[project.urls]
Repository = "https://github.com/techfreakworm/ltx2.5-studio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ltx25_studio", "ltx25_studio.lora", "ltx25_studio.ui"]

[tool.setuptools.package-data]
"ltx25_studio.lora" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
# --continue-on-collection-errors: this is a TDD loop, so specs routinely import
# symbols that do not exist yet. Without the flag, ONE uncollectable module
# aborts collection for the whole suite and the 400+ passing tests report
# nothing — which destroys the signal we steer by. Collection errors still make
# the run exit non-zero, so nothing sneaks through as a pass.
addopts = "-ra --continue-on-collection-errors"
testpaths = ["tests"]
norecursedirs = [".venv", ".git", "outputs", "models", "assets"]
# Labels only: nothing deselects them, so they run wherever their own skip
# conditions allow.
markers = [
    "gpu: needs a GPU and real weights on disk",
    "network: reaches the Hugging Face Hub",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded: ruff would reformat the code samples embedded in
# docs/PLAN.md, which are quoted verbatim from upstream source on purpose.
exclude = [".venv/", "outputs/", "models/", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is the formatter's job, not the linter's

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports inside test functions are fine
